{% extends "base.html" %}

{% block title %}Server Error — Care Plus{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
    <div class="card" style="padding: 3rem 2rem;">
        <div class="error-code">500</div>
        <h1 style="font-size: 2.2rem; color: #ef4444; margin-bottom: 0.5rem;">500 — System Error</h1>
        <p style="color: var(--text-muted); margin-bottom: 1.75rem;">
            Care Plus encountered an internal error. Please try again or return to the main dashboard.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Care Plus Dashboard</a>
    </div>
</div>
{% endblock %}
