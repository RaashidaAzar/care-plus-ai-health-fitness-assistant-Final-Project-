{% extends "base.html" %}

{% block title %}Page Not Found — Care Plus{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
    <div class="card" style="padding: 3rem 2rem;">
        <h1 style="font-size: 2.2rem; color: var(--primary-color); margin-bottom: 0.5rem;">404 — Page Not Found</h1>
        <p style="color: var(--text-muted); margin-bottom: 1.75rem;">
            The requested page or health record could not be found in the Care Plus system.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Care Plus Dashboard</a>
    </div>
</div>
{% endblock %}
